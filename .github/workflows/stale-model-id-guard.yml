name: Stale model-ID guard

on:
  pull_request:
    paths:
      - '**/*.py'
      - '**/*.md'
      - '**/*.yml'
      - '**/*.yaml'
      - '**/*.json'
      - '**/*.txt'
      - '**/*.sh'
      - '!.delivery/**'

permissions:
  contents: read

jobs:
  stale-id-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan for non-allowlisted model IDs
        run: |
          set -uo pipefail
          # Positive allowlist (ADR-models-001). Rollover = edit ALLOW only.
          # Tails are prefix-less; the sed below supplies the claude- prefix.
          ALLOW='fable-5-1|opus-5|sonnet-5|haiku-4-5-20251001'
          # Any versioned model-ID token (family + digit), incl. dotted/suffixed.
          TOK='claude-(opus|sonnet|haiku|fable|mythos)-[0-9][-A-Za-z0-9.]*[-A-Za-z0-9]|claude-(opus|sonnet|haiku|fable|mythos)-[0-9]'
          # Valid delimiter after an allowed ID: EOL, non-token char, or "." then non-alnum.
          D='$|[^-A-Za-z0-9.]|\.($|[^-A-Za-z0-9])'
          # Provenance: lines starting with # or > (after file:line:) are exempt.
          HITS=$(git ls-files '*.py' '*.md' '*.yml' '*.yaml' '*.json' '*.txt' '*.sh' \
              ':!:.delivery/*' ':!:prd-quality-gate-flow/prd_flows.db' ':!:.github/workflows/stale-model-id-guard.yml' \
            | xargs grep -EnH "$TOK" 2>/dev/null \
            | grep -vE '^[^:]+:[0-9]+:[[:space:]]*[#>]' \
            | sed -E "s/claude-($ALLOW)($D)/<OK>\2/g" \
            | grep -E 'claude-(opus|sonnet|haiku|fable|mythos)-[0-9]' \
            || true)
          if [ -n "$HITS" ]; then
            echo "::error::Non-allowlisted model IDs detected."
            echo "$HITS"
            echo ""
            echo "Fix: use an allowlisted ID (see ALLOW in this workflow)."
            echo "Historical provenance must sit on its own '#' comment or '>' blockquote line."
            exit 1
          fi
          echo "No non-allowlisted model IDs found."
