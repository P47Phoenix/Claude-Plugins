name: Model-pin guard

# Static scan only. No CLI agent calls in CI (runners do not have the tool).
# Patterns live in scripts/check_model_pins.py, nowhere else.
# On push this detects after the fact; the local ship gate blocks.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  model-pin-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Scan for model pins, stamps and version prose
        run: |
          set -uo pipefail
          python3 scripts/check_model_pins.py --list
