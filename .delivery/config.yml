config_version: "2.2"
project_type: FEATURE
tech_stack:
  languages: [Python, Markdown, Shell, TypeScript, JavaScript]
  frameworks: []
  databases: []
  ci_cd: github-actions
  paradigm: hybrid
  paradigm_by_language:
    python: hybrid
    typescript: hybrid
    javascript: hybrid
  nx_workspace: false
architecture:
  style: auto
  style_overrides: {}
  decomposition: volatility
  decision_matrix_inputs:
    team_size: 4
    deploy_independence: low
    domain_complexity: high
    change_rate: high
enforcement:
  source_code_hook: true
  retro_frequency: every-run
  retro_skip_allowed: false
team:
  size: 4
  composition: [po, architect, developer, qa, operations, ui, user-feedback, presentation]
deployment:
  environment: local
  containerized: false
timeline:
  risk_tolerance: standard
  deadline: null
compliance:
  frameworks: []
pipeline:
  scope: all
  scope_include: []
  scope_exclude: [".delivery/", ".git/", "node_modules/", "__pycache__/"]
  checkpoints: [refine, uat]
  collaboration_patterns: [evaluator-optimizer, adversarial, review-board, debate, consensus, decision-routing]
  max_self_correction: 3
  max_dod_rounds: 3
  max_parallel_agents: 3
  parallel_stories: true
  parallel_validators: true
  verify_skill_loading: true
  delegation_retry_max: 2
  isolation_audit: warn
  metadata_max_chars: 200
  agent_timeout: 120
  required_agent_retry_max: 2
dod_validators:
  idea: [po, architect]
  refine: [po, architect, qa]
  design: [ux, po, qa, architect]
  architect: [architect, qa, devops, security]
  plan: [sm, po, qa, devops]
  development: [developer, qa, architect, tech-writer]
  uat: [qa, devops, po, tech-writer]
personas:
  categories: [web-users, enterprise]
  selected: []
  feedback_stages: [refine, design, dev, uat]
  count: 5
  overlays: []
  custom: []
aliases:
  theme: lotr
  custom_path: .delivery/aliases/
notifications:
  channels: [console]
  events: [complete, abort, escalation]
monorepo:
  enabled: false
  tool: none
  scope: root
git:
  branch_strategy: github-flow
  auto_branch: false
  commit_convention: conventional
  clean_tree_check: true
github:
  create_issues: true
  create_pr: false
  link_commits: true
presentation:
  default_format: structured-markdown
  default_audience: technical
  speaker_notes: false
  save_to_artifacts: true
  marp_theme: default
  staleness_warning_days: 7
  vocabulary_overrides: {}
wizard_completed: 2026-03-25
