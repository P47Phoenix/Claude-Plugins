# to-be-constraints.yml — Claude-Plugins marketplace (Phase 2 TO-BE model)
#
# Phase:  2 TO-BE (Architect-led)
# Run:    US-8-dogfood-phase1b-2-3
# Date:   2026-04-08
# Input:  .delivery/artifacts/08-transform/as-is-constraints.yml
# Scribe: Celebrimbor of Eregion
#
# Scope:  Realistic near-term TO-BE. Ships the backlog that is already
#         half-forged (transformation-planning task_type, paradigm-as-skill
#         registry, empirical measurement of architecture-board overhead).
#         Not a moonshot — a next-anvil.

entities:
  # Inherited AS-IS subsystems that persist unchanged
  - delivery_flow_orchestrator
  - product_delivery_skill
  - architect_skill
  - developer_skill
  - godot_skill
  - quality_skill
  - operations_skill
  - ui_skill
  - user_feedback_skill
  - alias_creator_skill
  - presentation_skill
  - agentic_flow_builder_plugin
  - prompt_engineer_plugin
  - prd_quality_gate_flow_plugin
  - research_agent_plugin
  - mtg_commander_plugin
  - constraints_yml_primitive
  - architecture_board_pattern
  - memory_system
  # TO-BE additions
  - transformation_planning_task_type      # shipped this run (c4d1)
  - paradigm_skill_registry                # BACKLOG-005 target
  - volatility_decomposition_skill         # extracted paradigm (first slice)
  - ddd_decomposition_skill                # extracted paradigm (second slice)
  - functional_decomposition_skill         # extracted paradigm (second slice)
  - empirical_measurement_harness          # for plan-first-try-rate + board overhead

state_variables:
  - current_stage
  - pipeline_id
  - stages_completed
  - memory_index_version
  - marketplace_version
  - active_backlog_count
  - open_defect_count
  - transformation_run_id
  - paradigm_skill_active

actions:
  - run_delivery_pipeline
  - resume_pipeline
  - configure_via_setup_wizard
  - register_plugin_in_marketplace
  - log_and_track_defects
  - run_prd_quality_gate
  - build_mtg_deck
  - compose_team_presentation
  - invoke_transformation_planning
  - select_decomposition_paradigm
  - measure_plan_first_try_rate_empirically

numeric_ceilings:
  plan_first_try_pct: 80
  subsystem_change_per_roadmap_step_pct: 30
  min_use_cases_per_transformation: 5
  sprint_ceiling_pts_target: 5
  max_dod_rounds: 3
  max_parallel_agents: 3

mandatory_artifacts:
  - ".delivery/artifacts/NN-stage/"
  - ".delivery/artifacts/NN-transform/"
  - ".delivery/memory/index.md"
  - ".delivery/config.yml"
  - "SKILL.md"
  - ".claude-plugin/marketplace.json"
  - "per_paradigm_skill_registration"

invariants:
  - "Two-channel communication: orchestrator signals and domain artifacts are separate"
  - "Context isolation: sub-agents receive only role-scoped references"
  - "DoD validation is multi-validator — ALL validators must say DONE"
  - "Orchestrator does not produce domain artifacts itself"
  - "Self-correction loops are capped at 3 rounds before escalation"
  - "Retrospective is mandatory at Stop — enforced by hook"
  - "Light stages reduce depth but never skip execution"
  - "Every brownfield engagement runs transformation-planning before architecture"
  - "constraints.yml primitive is used at every stage transition"
  - "architecture-board pattern is optional but available to any stage"

forbidden_vocabulary:
  - lambda
  - aws lambda
  - ecr
  - ecs
  - eks
  - sqs
  - sns
  - eventbridge
  - dynamodb
  - s3
  - kinesis
  - fargate
  - ec2
  - gcp
  - azure functions
  - kubernetes
  - docker
  - python
  - node
  - typescript
  - javascript
  - go
  - rust
  - java
  - express
  - fastapi
  - django
  - postgresql
  - mysql
  - mongodb

citations:
  - work: "Righting Software"
    chapter: "2"
    page: "Golden Rule"
  - work: "as-is-constraints.yml"
    chapter: "current state"
    page: "-"
  - work: "BACKLOG-006"
    chapter: "proposed direction"
    page: "-"
