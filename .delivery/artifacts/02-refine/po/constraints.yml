# constraints.yml -- Refine stage (MTG Commander Adversarial Review + Price Rules)
#
# Pipeline:  run-2026-04-11-e6f3 (FEATURE)
# PO:        Gandalf
# Date:      2026-04-11
# Schema:    ADR-001 (8 fields, entities + invariants required)

entities:
  - challenger_agent
  - adversarial_loop
  - user_config_file
  - soft_price_goal
  - price_escalation_prompt
  - config_schema_validator
  - deterministic_deck_validator
  - ck_divergence_checker
  - sub_agent_dispatch_guardrail
  - price_goal_escalation_flow

invariants:
  - "Challenger is a separate Agent invocation -- no shared context with primary agent reasoning"
  - "Per-step loops are independent of pipeline-level correction cycles"
  - "Pipeline works identically when .mtg-commander.yml is absent"
  - "Existing 15%-of-budget per-card CAP remains as hard rule -- soft goal is additive"
  - "Config parse failures warn but never fail the pipeline"
  - "Rules Judge Challenger uses validate-deck deterministically -- zero LLM legality claims"
  - "Budget-wins tiebreaker preserved -- budget takes priority over synergy"
  - "Core agent prompts are augmented with Challengers, not rewritten"
  - "No new external APIs beyond Scryfall and Archidekt"
  - sub_agents_mandatory: true  # Every pipeline step (primary + challenger) MUST be a separate Agent tool invocation. Inlining is a guardrail violation.
  - "Price goal escalation is BLOCKING -- pipeline pauses until user responds. No timeout, no auto-accept."

forbidden_vocabulary:
  - "replace Rules Judge"
  - "replace Optimizer"
  - "new API"
  - "partner commander"
  - "delivery-flow integration"

numeric_ceilings:
  default_loops_per_step: 2
  max_loops_per_step: 5
  ck_divergence_threshold_per_card_pct: 30
  ck_divergence_threshold_total_pct: 20
  max_pipeline_correction_cycles: 3
  challenger_agents_count: 4

state_variables:
  - config_loaded
  - challenger_verdict_per_step
  - loop_iteration_per_step
  - escalation_pending
  - max_card_price_goal
  - user_escalation_response
  - sub_agent_dispatch_enforced
  - price_substitution_attempted

actions:
  - load_user_config
  - validate_config_schema
  - spawn_challenger_agent
  - evaluate_challenger_verdict
  - escalate_price_goal_violation
  - run_deterministic_deck_validation
  - fetch_ck_prices_independently
  - compare_vendor_divergence
  - enforce_sub_agent_dispatch
  - attempt_budget_substitution
  - escalate_unsubstitutable_card

mandatory_artifacts:
  - .delivery/artifacts/01-idea/po/idea-brief.md
  - .delivery/artifacts/02-refine/po/prd.md
  - .delivery/artifacts/02-refine/po/constraints.yml
  - mtg-commander/SKILL.md (updated)

citations:
  - work: "DEFECT-001.md"
    chapter: "Root Cause"
    page: "-"
  - work: "DEFECT-002.md"
    chapter: "Suggested Fix"
    page: "-"
  - work: "mtg-commander/SKILL.md"
    chapter: "Agent Pipeline"
    page: "-"
  - work: "price-evaluator-guide.md"
    chapter: "Budget-Wins Tiebreaker"
    page: "-"
