# .delivery/artifacts/02-refine/po/constraints.yml
# Problem-scoped constraints for: model literals refresh + stale-model-id-guard redesign
# Branch: delivery-team-agent-wrappers (PR #88 worktree). Supersedes prior-run content (BACKLOG-106).

problem_scope: repo-wide migration of hard-coded model IDs to the latest set, plus positive-allowlist CI guard

binding_constraints:
  - id: BC-01
    rule: CI guard is static grep only (git ls-files | grep). No claude CLI, curl, wget, pip or network in workflows.
    source: memory feedback_claude_code_local_only.md
    bypass_allowed: false
  - id: BC-02
    rule: Guard is a positive allowlist of exactly claude-fable-5-1, claude-opus-5, claude-sonnet-5, claude-haiku-4-5-20251001. Whole-token match (token regex claude-(opus|sonnet|haiku|fable|mythos)-[0-9][-A-Za-z0-9.]*[-A-Za-z0-9]; a trailing '.' or ',' is not part of the token); anything else matching claude-(opus|sonnet|haiku|fable|mythos)-<digit> fails.
    source: PRD Q3 / FR-6; memory allowlist-over-deny lesson
    bypass_allowed: false
  - id: BC-03
    rule: No dual-allow window. Literals and guard allowlist ship in one atomic commit.
    source: BINDING-2.1 (carried from BACKLOG-108); PRD FR-11
    bypass_allowed: false
  - id: BC-04
    rule: "Provenance exemption is retained. Lines whose content starts with '#' or '>' (after the file:line prefix) are exempt. A trailing mid-line '# prior: ...' on a code line is NOT exempt."
    source: PRD FR-2 / FR-7
    bypass_allowed: false
  - id: BC-05
    rule: Use GNU grep (/usr/bin/grep). No PCRE-only or BSD-only flags in the workflow.
    source: task invocation
    bypass_allowed: false
  - id: BC-06
    rule: Workflow run blocks must not interpolate ${{ github.event.* }}.
    source: .github/workflows/workflow-injection-lint.yml (DEFECT-004 guard)
    bypass_allowed: false
  - id: BC-07
    rule: Fable is not adopted in any role. claude-fable-5-1 is permitted by the guard only. Registry keeps three default agents.
    source: PRD Q4/Q5
    bypass_allowed: false
  - id: BC-08
    rule: Tier mapping preserved. Sonnet sites -> claude-sonnet-5; Opus sites -> claude-opus-5; Haiku claude-haiku-4-5-20251001 unchanged.
    source: PRD section 5
    bypass_allowed: false
  - id: BC-09
    rule: model_awareness stamps, "Opus 4.7"/F-08/xhigh prose, family-alias model frontmatter, .delivery/ history and CHANGELOG history are NOT edited.
    source: PRD section 4
    bypass_allowed: false
  - id: BC-10
    rule: delivery-team/skills/delivery-flow/SKILL.md is not edited; governance/cache-prefix-hash.txt is not re-frozen in this change.
    source: PRD section 7
    bypass_allowed: false
  - id: BC-11
    rule: Smoke fixture string edits in conftest.py are separate from harness logic; existing smoke tests keep passing (baseline 3 passed).
    source: BINDING-4.5; PRD FR-4
    bypass_allowed: false
  - id: BC-12
    rule: SKILL.md budgets hold (scripts/check_skill_budgets.py exit 0); prompt-engineer/SKILL.md edit is line-count neutral and made via plugin-dev:skill-development.
    source: CLAUDE.md; PRD FR-10
    bypass_allowed: false
  - id: BC-13
    rule: Merge blocked until QA records live-page verification of all four IDs in .delivery/artifacts/06-development/qa/model-id-verification.md.
    source: PRD FR-9; memory (external claims cite live URL)
    bypass_allowed: false
  - id: BC-14
    rule: BACKLOG-108 is not edited (untracked, main checkout). Supersede text lives in PRD section 9.
    source: task invocation
    bypass_allowed: false

scan_surface:
  globs: ['*.py', '*.md', '*.yml', '*.yaml', '*.json', '*.txt', '*.sh']
  excluded: ['.delivery/', 'prd-quality-gate-flow/prd_flows.db', '.github/workflows/stale-model-id-guard.yml']

allowlist:
  - claude-fable-5-1
  - claude-opus-5
  - claude-sonnet-5
  - claude-haiku-4-5-20251001

verification_sources:
  - url: https://platform.claude.com/docs/en/about-claude/models/overview
    status: unverified-live   # verified only against claude-api skill cache 2026-06-24; QA re-fetch required (BC-13)
