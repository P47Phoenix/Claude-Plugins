# .delivery/artifacts/02-refine/po/constraints.yml
# Problem-scoped constraints for BACKLOG-108 (latest-model references; Revision 5)
# Run: run-2026-05-28-backlog-108

problem_scope: remove hard-pinned model version strings repo-wide and refer to the latest version of a model family; migrate today's stale 4.7 pins to that scheme (user decision 2026-09-20, supersedes the claude-opus-5 pin)

entities:
  - SKILL.md model_awareness stamp
  - pinned model-version literal (any claude-<family>-<digit> string)
  - MODEL_TIER_ALIAS central alias dict
  - CI stale-model-id guard
  - smoke baseline JSON
  - cache-prefix fingerprint
  - dispatch manifest

invariants:
  - One Role = One Sub-Agent; dispatch count equals stage dod_validators length
  - No pinned model-version string, versioned stamp, or model-version prose mention (PIN_RE, STAMP_RE, PROSE_RE, BARE_RE; counts and durations filtered by COUNT_RE) in py/md/yml/yaml/txt/sh outside CHANGELOG.md and .delivery/; NO comment, blockquote, heading or code-fence exemption and NO per-line escape (a sentence that trips the guard is reworded)
  - Baselines record the concrete model observed at run time (model_resolved, primary = system/init model); never assumed; an unknown or empty model is a capture failure
  - model_awareness stamps are applied only after prose review passes DoD
  - No .github/workflows file invokes the claude CLI; no smoke-*.yml workflow
  - Shipped behavioral claims about the latest Opus are doc-cited and version-free; no provisional text
  - Each success gate is closed by exactly one story

binding_constraints:
  - id: BC-01
    rule: SKILL.md edits route through plugin-dev:skill-development; hook/workflow edits route through plugin-dev:hook-development. Acknowledged before edit. No bypass.
    source: CLAUDE.md key conventions
    bypass_allowed: false
  - id: BC-02
    rule: Every behavioral claim about the latest Opus is doc-verified via WebFetch before it ships in prose. No provisional text. No training-data assertions. Adversarial reviewer independently re-fetches >= 3 load-bearing claims.
    source: BINDING-3.1, BINDING-3.2, BINDING-3.3
    primary_url: https://platform.claude.com/docs/en/about-claude/models/overview
    secondary_urls:
      - https://platform.claude.com/docs/en/models/opus-5/migration-guide
      - https://platform.claude.com/docs/en/build-with-claude/effort
    bypass_allowed: false
  - id: BC-03
    rule: No new CLI dependencies in any acceptance-criteria command. Bash builtins and python-stdlib only. No yq. Commands must run on a default host.
    source: PO Refine memory lesson — developer-DoD commands must use no new CLI deps
    bypass_allowed: false
  - id: BC-04
    rule: Local-only. No .github/workflows file shells out to the claude CLI. CI permitted for static guards only (YAML lint, model-pin scan, budget checks). The pin guard runs on push to main, pull_request and workflow_dispatch, and the same script runs locally before ship.
    source: BINDING-5.2, BINDING-4.6, feedback_claude_code_local_only.md
    bypass_allowed: false
  - id: BC-05
    rule: One Role = One Sub-Agent. Dispatch count equals the stage dod_validators list length. Fused role dispatches fail DoD regardless of artifact quality.
    source: BINDING-5.4
    bypass_allowed: false
  - id: BC-06
    rule: Pin-forbidding CI guard ships from day one. Guard ships in its final pin-forbidding form from day one (no version allowlist, no dual-allow window). Squash before merge so the guard never inspects a partial mid-merge state.
    source: BINDING-2.1, BINDING-5.1
    bypass_allowed: false
  - id: BC-07
    rule: Producer-validator separation. Smoke meta-test fixtures testing the smoke lib are authored in a SEPARATE Agent dispatch from the producer-file authors. Observable invariants (FR-4.4) - separate commits; disjoint non-empty Dispatch-Id trailer sets; producer lib/ unchanged from validator start to validator END; the real_shape test fails against the unfixed parser first (AC-5.9b).
    source: BINDING-4.5
    applies_to:
      producer:
        - delivery-team/tests/smoke/lib/metrics.py
        - delivery-team/tests/smoke/lib/baseline.py
        - delivery-team/tests/smoke/lib/runner.py
        - delivery-team/tests/smoke/lib/report.py
        - delivery-team/tests/smoke/lib/aggregator.py
        - delivery-team/tests/smoke/run_smoke.py
      validator:
        - delivery-team/tests/smoke/tests/test_model_capture.py
        - delivery-team/tests/smoke/tests/fixtures/
    bypass_allowed: false
  - id: BC-08
    rule: Ship via squash-rebase + ff-merge + push origin/main. No PR.
    source: BINDING-5.1
    bypass_allowed: false

line_budgets:
  tier_a: 500
  tier_b: 300
  tier_c: 200
  enforced_by: scripts/check_skill_budgets.py
  exception_protocol: Budget-Exception line in commit body PLUS known_debt[] entry with target_wave

model_refs:
  scheme: refer to the latest version of a model family; never pin a version string in the tree
  prose: name families only ("the latest Opus"); no version numbers in SKILL.md
  stamps:
    model_awareness: latest
    pattern_library_version: rev-1
    last_audited: date of the S3 DoD pass (time anchor; applied only to the 25 already-stamped files)
    applied: after prose review passes DoD (not before)
    source: BINDING-2.3
  cli_aliases: [opus, sonnet, haiku]      # Claude Code aliases; opus and sonnet documented as latest, haiku wording UNVERIFIED
  api: no evergreen alias exists for current models; code that calls the API reads ONE config value
  central_definition: agentic-flow-builder/scripts/agent_registry.py MODEL_TIER_ALIAS
  guard_patterns:            # single definition point: scripts/check_model_pins.py (PRD FR-1.2 has the exact strings)
    PIN_RE: family-agnostic claude-<anything>-<digit> or claude-<anything>-latest, case-insensitive
    STAMP_RE: any digit in a model_awareness value; pattern_library_version must be rev-<n>
    PROSE_RE: Opus/Sonnet/Haiku/Fable/Mythos followed by a version digit (capitalised or upper case), or lowercase alias with hyphen-digit
    BARE_RE: bare version numbers (4.7 style) in md prose after on/under/in/for/the/new/so/with/isolates
    COUNT_RE: false-positive filter; a family word plus integer plus count noun, or a context word plus decimal plus time/size unit, is blanked before PROSE_RE and BARE_RE
    scope: git ls-files --cached --others --exclude-standard, py, md, yml, yaml, txt, sh files; json is outside scope by design (baselines record observed IDs)
  allowlisted_locations: [CHANGELOG.md, ".delivery/**"]   # no per-line escape exists
  frontmatter_tier_aliases:  # 9 lines in 9 SKILL.md (model: and phase_1_detector_model:); each value must be one of opus, sonnet, haiku
    allowed_values: [opus, sonnet, haiku]
  exempt:
    rule: prd-quality-gate-flow routing aliases are version-agnostic labels, not pins
    source: BINDING-1.4

cost_limits:
  per_run_usd: 3.00
  baseline_capture_usd_envelope: 15.00   # 5 runs x $3 cap for --init-baseline
  wall_clock_seconds: 1800               # 30 min hard ceiling per run
  concurrency: 1                         # baseline capture enforces sequential
  cli_budget_flag: --max-budget-usd      # runner passes the per-run cap to claude itself (in-process cap cannot fire on the real stream)

smoke_metrics:
  confirmed_observable:                   # track always (BINDING-4.1)
    - tokens.cache_hit_ratio
    - model_usage.<model>.dispatches
    - model_resolved
  best_effort:                            # WARN not FAIL when absent (BINDING-4.2)
    - thinking_tokens
    - stop_details.refusal_code
    - speed_or_fast_indicator
  runner_effort: xhigh                    # BINDING-4.3
  runner_model: opus                      # CLI alias; concrete model recorded as model_resolved
